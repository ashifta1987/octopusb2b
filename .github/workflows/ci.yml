name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Vercel reports preview deployments as GitHub deployments → run the Postman collection against each preview.
  deployment_status:
  # SPEC §16: weekly backup → restore drill (staging → scratch); also runnable by hand.
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.deployment.id || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · typecheck · unit tests
    if: ${{ github.event_name != 'deployment_status' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p .

      - name: Unit tests (Vitest)
        run: pnpm exec vitest run

      - name: Postman collections match the contracts (SPEC §15.2)
        run: node scripts/postman-sync.mjs --check

  db-security:
    name: Database security tests (staging)
    runs-on: ubuntu-latest
    needs: checks
    # Runs only when a staging DATABASE_URL secret is configured (tests run in rolled-back transactions).
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: RLS / RPC rule tests
        if: ${{ env.DATABASE_URL != '' }}
        run: node supabase/tests/rls.test.mjs

  postman-preview:
    name: Postman collection vs Vercel preview (Newman)
    # Runs when Vercel marks a Preview deployment successful (one per pull-request push).
    if: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Preview') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      POSTMAN_SANDBOX_CLIENT_ID: ${{ secrets.POSTMAN_SANDBOX_CLIENT_ID }}
      POSTMAN_SANDBOX_CLIENT_SECRET: ${{ secrets.POSTMAN_SANDBOX_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check sandbox credentials
        run: |
          if [ -z "$POSTMAN_SANDBOX_CLIENT_ID" ] || [ -z "$POSTMAN_SANDBOX_CLIENT_SECRET" ]; then
            echo "::error::Set POSTMAN_SANDBOX_CLIENT_ID and POSTMAN_SANDBOX_CLIENT_SECRET (an oct_test_ key) — see postman/README.md"
            exit 1
          fi
          echo "Preview: $URL"

      - name: Wait for the preview API
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" "$URL/api/v1/openapi.json" || true)
            [ "$code" = "200" ] && exit 0
            echo "waiting for $URL ($code)…"; sleep 10
          done
          echo "::error::Preview API did not become ready"; exit 1

      - name: Newman — Octopus B2B API v1
        run: >
          npx --yes newman@6 run postman/octopus-b2b-api-v1.postman_collection.json
          -e postman/sandbox.postman_environment.json
          --env-var "base_url=$URL/api/v1"
          --env-var "client_id=${{ secrets.POSTMAN_SANDBOX_CLIENT_ID }}"
          --env-var "client_secret=${{ secrets.POSTMAN_SANDBOX_CLIENT_SECRET }}"
          --env-var "vercel_bypass=${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"
          --reporters cli,junit --reporter-junit-export newman/results.xml

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-${{ github.event.deployment.id }}
          path: newman/

  backup-restore-drill:
    name: Backup staging → restore into scratch (counts + ledger)
    # SPEC §16.5 tests: dump the staging DB, restore it into the scratch DB, compare row counts + ledger totals per currency.
    # Skipped when STAGING_DB_URL / SCRATCH_DB_URL are not configured. SCRATCH_DB_URL lives in the `restore-scratch`
    # environment (no required reviewers); STAGING_DB_URL may be a repository or environment secret.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: restore-scratch
    env:
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL || secrets.STAGING_DATABASE_URL }}
      SCRATCH_DB_URL: ${{ secrets.SCRATCH_DB_URL }}
    steps:
      - name: Check secrets
        id: cfg
        run: |
          if [ -z "$STAGING_DB_URL" ] || [ -z "$SCRATCH_DB_URL" ]; then
            echo "::notice::STAGING_DB_URL / SCRATCH_DB_URL not set — skipping the backup/restore drill"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip == 'false'
      - uses: pnpm/action-setup@v4
        if: steps.cfg.outputs.skip == 'false'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip == 'false'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.cfg.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.skip == 'false'
        with:
          version: latest
      - name: Install psql 17
        if: steps.cfg.outputs.skip == 'false'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Back up staging
        if: steps.cfg.outputs.skip == 'false'
        run: |
          mkdir -p work/empty
          supabase db dump --db-url "$STAGING_DB_URL" -f work/roles.sql --role-only
          supabase db dump --db-url "$STAGING_DB_URL" -f work/schema.sql
          supabase db dump --db-url "$STAGING_DB_URL" -f work/data.sql --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"
          node scripts/backup/manifest.mjs stats --data work/data.sql --out work/stats.json
          node scripts/backup/manifest.mjs build --dir work/empty --code CI-DRILL --stats work/stats.json --out work/manifest.json
      - name: Restore into scratch
        if: steps.cfg.outputs.skip == 'false'
        run: |
          node scripts/backup/prepare-restore.mjs --roles work/roles.sql --roles-out work/roles.safe.sql --reset-out work/reset.sql --post-out work/post.sql
          psql --single-transaction -v ON_ERROR_STOP=1 -q -f work/reset.sql -f work/roles.safe.sql -f work/schema.sql \
            -c 'SET session_replication_role = replica' -f work/data.sql -f work/post.sql --dbname "$SCRATCH_DB_URL"
      - name: Compare counts + ledger totals
        if: steps.cfg.outputs.skip == 'false'
        run: |
          node scripts/backup/checks.mjs --db-url "$SCRATCH_DB_URL" --manifest work/manifest.json --append work/checks.json --only row_counts,ledger_balanced,migration_version
          node -e 'const c=JSON.parse(require("fs").readFileSync("work/checks.json","utf8")); const f=c.filter(x=>x.status==="fail"); if(f.length){console.error(JSON.stringify(f,null,2)); process.exit(1)}'
      - name: Clean up
        if: always()
        run: rm -rf work
