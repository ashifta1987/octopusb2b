name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · typecheck · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p .

      - name: Unit tests (Vitest)
        run: pnpm exec vitest run

  db-security:
    name: Database security tests (staging)
    runs-on: ubuntu-latest
    needs: checks
    # Runs only when a staging DATABASE_URL secret is configured (tests run in rolled-back transactions).
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: RLS / RPC rule tests
        if: ${{ env.DATABASE_URL != '' }}
        run: node supabase/tests/rls.test.mjs
